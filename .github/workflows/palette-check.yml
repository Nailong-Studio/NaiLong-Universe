name: Palette Check

on:
  push:
    paths:
      - "palette.json"
      - "themes/**"
      - "scripts/generate.py"
  pull_request:
    paths:
      - "palette.json"
      - "themes/**"
      - "scripts/generate.py"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify themes match palette.json
        run: |
          python3 scripts/generate.py --check
          python3 themes/vscode/scripts/generate.py --check
